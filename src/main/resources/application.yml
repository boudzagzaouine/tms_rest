spring:
  # Spring Boot 2.6+ forbids bean circular references by default; this code base (originally on
  # Boot 2.2) relies on several service<->service cycles. Re-enabled to preserve behaviour during
  # the Java 21 / Boot 3 migration. TODO: refactor the cycles (e.g. @Lazy) and remove this flag.
  main:
    allow-circular-references: true
  datasource:
    tomcat:
      test-while-idle: true
      validation-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
    generate-ddl: true
    database: postgresql
    properties:
      hibernate:
        enable_lazy_load_no_trans: true
        # Cap eager join-fetch depth for many-to-one/one-to-one associations. Without this, deep
        # entity graphs (e.g. saving a transport plan pulls plan+vehicle+order+... into one join)
        # produce a SELECT with > 1664 columns, which PostgreSQL rejects. Deeper associations are
        # now loaded via separate selects instead of one monster join.
        max_fetch_depth: 1
        default_schema: schema_tmsvoieexpress
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    serialization:
      fail-on-empty-beans: false

  # Kafka: async driver-location streaming for track & trace. Points to the local Redpanda/Kafka
  # broker from docker-compose.yml. Override KAFKA_BOOTSTRAP_SERVERS in other environments.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
    consumer:
      group-id: tms-location-ingest
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.bagile.gmo.dto.event.DriverLocationEvent
        spring.json.trusted.packages: com.bagile.gmo.dto.event
    listener:
      # Keep the app bootable when no broker is running: the listener retries the connection in the
      # background instead of failing startup. Set to false to disable ingestion entirely.
      missing-topics-fatal: false

  servlet:
    multipart:
      max-request-size: 25MB
      max-file-size: 10MB

# Driver-location streaming toggle. When false, the @KafkaListener does not auto-start (handy for
# running the API without a broker); the synchronous POST /transportPlanLocations/save still works.
tms:
  location-streaming:
    enabled: ${TMS_LOCATION_STREAMING_ENABLED:true}
    topic: driver-locations

server:
  port: 8080
  servlet:
    context-path: /tms-rest

# JWT settings. In production, supply JWT_SECRET (>= 32 chars) and the expiries via env vars;
# the defaults below are for local development only. The access token is short-lived; when it
# expires the frontend silently obtains a new one with the long-lived refresh token.
jwt:
  secret: ${JWT_SECRET:tms-voieexpress-dev-secret-change-me-in-production-0123456789}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}            # access token: 15 minutes
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # refresh token: 7 days


