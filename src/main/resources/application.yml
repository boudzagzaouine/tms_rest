spring:
  # Spring Boot 2.6+ forbids bean circular references by default; this code base (originally on
  # Boot 2.2) relies on several service<->service cycles. Re-enabled to preserve behaviour during
  # the Java 21 / Boot 3 migration. TODO: refactor the cycles (e.g. @Lazy) and remove this flag.
  main:
    allow-circular-references: true
  datasource:
    tomcat:
      test-while-idle: true
      validation-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
    generate-ddl: true
    database: postgresql
    properties:
      hibernate:
        enable_lazy_load_no_trans: true
        default_schema: schema_tmsvoieexpress
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    serialization:
      fail-on-empty-beans: false

  servlet:
    multipart:
      max-request-size: 25MB
      max-file-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /tms-rest

# JWT settings. In production, supply JWT_SECRET (>= 32 chars) and the expiries via env vars;
# the defaults below are for local development only. The access token is short-lived; when it
# expires the frontend silently obtains a new one with the long-lived refresh token.
jwt:
  secret: ${JWT_SECRET:tms-voieexpress-dev-secret-change-me-in-production-0123456789}
  expiration-ms: ${JWT_EXPIRATION_MS:900000}            # access token: 15 minutes
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # refresh token: 7 days


