spring:
  main:
    # Boot 2.6+ prohibits bean circular references by default. This codebase has many
    # field-injected service cycles (e.g. accountPricingService <-> companyService).
    # Re-enabled to preserve behavior during the framework migration; breaking the
    # cycles is tracked as separate tech-debt cleanup, not part of this migration.
    allow-circular-references: true
  datasource:
    tomcat:
      test-while-idle: true
      validation-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
    generate-ddl: true
    database: postgresql
    properties:
      hibernate:
        enable_lazy_load_no_trans: true
        default_schema: schema_tmsvoieexpress
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    serialization:
      fail-on-empty-beans: false

  servlet:
    multipart:
      max-request-size: 25MB
      max-file-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /tms-rest


